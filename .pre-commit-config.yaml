repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.23.0"
    hooks:
      - id: ruff
        additional_dependencies: ["ruff>=0.12.0"]

  - repo: https://github.com/psf/black
    # Keep in step with the `black` floor in requirements-dev.txt: a hook on
    # an older release formats differently from CI.
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3

name: Build and Release Mornye

permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Name of the version tag (es: v1.0.0)'
        required: false
        type: string

jobs:
  lint-and-bump:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.commit_and_bump.outputs.NEW_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install .

      - name: Auto-fix with ruff and black
        shell: bash
        run: |
          if command -v ruff >/dev/null 2>&1; then
            if ! ruff check --fix .; then
              echo "::warning::Ruff found remaining issues after automatic fixes; continuing with the release build."
            fi
          else
            echo "ruff not installed"
          fi
          if command -v black >/dev/null 2>&1; then black .; else echo "black not installed"; fi

      - name: Commit changes and bump version
        id: commit_and_bump
        shell: bash
        run: |
          # 1. Commit delle modifiche di formattazione (se esistono)
          #
          # The checkout above is a snapshot. Anything pushed to the branch
          # while this job was installing its dependencies leaves it behind,
          # and `git push` is then rejected as non-fast-forward — which used
          # to fail the whole release over a cosmetic commit.
          #
          # The formatters are re-run on top of the newer tree rather than
          # the commit being rebased onto it: a formatting commit rebased
          # over content changes conflicts on exactly the lines it rewrote,
          # and re-running is both conflict-free and idempotent. The result
          # is identical either way — the branch tip, formatted.
          #
          # Syncing also keeps the tag honest: it is created below on local
          # HEAD, so a HEAD that is behind the branch would tag a tree
          # nobody has.
          BRANCH="${GITHUB_REF#refs/heads/}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sync_and_format() {
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            ruff check --fix . || true
            black . || true
          }

          git fetch origin "$BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::warning::$BRANCH moved since checkout; re-formatting on top of its tip."
            sync_and_format
          fi

          for attempt in 1 2 3; do
            if [[ -z "$(git status --porcelain)" ]]; then
              echo "No formatting changes to commit."
              break
            fi

            echo "Format changes detected. Committing (attempt $attempt)..."
            git add .
            git commit -m "style: auto-fix ruff e black [skip ci]"

            if git push origin "HEAD:$BRANCH"; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not push the formatting commit: $BRANCH keeps moving under this job. Re-run the workflow when pushes have settled."
              exit 1
            fi
            echo "::warning::Push rejected — $BRANCH moved again. Re-syncing and retrying."
            sync_and_format
          done
          
          # 2. Calcolo del nuovo Tag (Manuale o Automatico)
          USER_INPUT="${{ github.event.inputs.version_tag }}"
          if [[ -n "$USER_INPUT" ]]; then
            echo "Using manually provided tag: $USER_INPUT"
            NEW_TAG="$USER_INPUT"
          else
            # Recupera i tag per far funzionare correttamente 'git describe'
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            
            if [[ $LATEST_TAG =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              
              NEW_PATCH=$((PATCH + 1))
              NEW_TAG="v$MAJOR.$MINOR.$NEW_PATCH"
              echo "Auto-bumping from $LATEST_TAG to $NEW_TAG"
            else
              NEW_TAG="v1.0.1" 
              echo "Regex failed on $LATEST_TAG. Falling back to default: $NEW_TAG"
            fi
          fi
          
          # 3. Creazione e Push del Tag
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            # Deliberately a hard stop, not a force-push. A tag that already
            # exists has been fetched by users, packaged by build-release and
            # (once publish.yml is tag-driven) shipped to PyPI: moving it
            # changes what "v1.2.3" means for everyone who already has it,
            # while PyPI still serves the artifact built from the old commit.
            # Pick the next version, or delete the tag deliberately by hand.
            echo "::error::Tag $NEW_TAG already exists. Bump the version or remove the tag explicitly; this workflow will not move a published tag."
            exit 1
          else
            echo "Creating new tag: $NEW_TAG"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi
          
          # 4. Output per il job di Release
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT

  build:
    needs: lint-and-bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            artifact_name: Mornye-Windows.exe
            build_name: Mornye-Windows

          - os: macos-latest
            arch: x86_64
            artifact_name: Mornye-macOS
            build_name: Mornye-macOS

          - os: ubuntu-latest
            arch: x86_64
            artifact_name: Mornye-Linux-x86_64
            build_name: Mornye-Linux-x86_64

          - os: ubuntu-latest
            arch: arm64
            artifact_name: Mornye-Linux-arm64
            build_name: Mornye-Linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: refs/tags/${{ needs.lint-and-bump.outputs.release_tag }}

    - name: Setup Python
      if: matrix.arch == 'x86_64'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies (x86_64 / macOS / Linux)
      if: matrix.arch == 'x86_64'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller certifi requests mutagen
        pip install .

    # libmpv for the Player's native engine; see the action for the pinning.
    - name: Fetch libmpv (Windows)
      if: runner.os == 'Windows'
      uses: ./.github/actions/fetch-libmpv

    - name: Build Mornye (x86_64 / macOS / Linux)
      if: matrix.arch == 'x86_64'
      shell: bash
      run: |
        EXTRA=()
        if [ "$RUNNER_OS" == "Windows" ]; then
          SEP=";"
          # Unpacked into sys._MEIPASS at start, the first place
          # native_player._libmpv_candidates looks.
          EXTRA+=(--add-binary "build/libmpv/libmpv-2.dll;.")
        else
          SEP=":"
        fi
        pyinstaller --onefile --name "${{ matrix.build_name }}" \
          --collect-all mornye \
          --add-data "mornye/frontend${SEP}mornye/frontend" \
          --add-data "mornye/extensions${SEP}mornye/extensions" \
          --add-data "mornye/tui${SEP}mornye/tui" \
          --hidden-import mornye.core.signed_session_desktop \
          --hidden-import mornye.core.signed_session_mobile \
          --hidden-import mornye.core.signed_session_mono \
          --hidden-import mpv \
          "${EXTRA[@]}" \
          --console launcher.py

    # A build that silently lost the engine would only show up on a user's
    # machine, as the Player falling back to the browser engine.
    - name: Check the native engine is bundled (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        LISTING="$(pyi-archive_viewer -r -b "dist/${{ matrix.artifact_name }}" | tr -d '\r' | sed 's/^ *//; s/ *$//')"
        for entry in libmpv-2.dll mpv; do
          if ! grep -qxF "$entry" <<<"$LISTING"; then
            echo "::error::$entry is missing from dist/${{ matrix.artifact_name }}"
            exit 1
          fi
        done
        echo "libmpv-2.dll and python-mpv are in the bundle."

    - name: Setup QEMU for ARM64
      if: matrix.arch == 'arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Build ARM64 Linux via Docker
      if: matrix.arch == 'arm64'
      shell: bash
      run: |
        docker run --rm --platform linux/arm64 \
          -v "$PWD":/workspace \
          -w /workspace python:3.12-bullseye \
          bash -c "
            pip install --upgrade pip && \
            pip install pyinstaller certifi requests mutagen && \
            pip install . && \
            pyinstaller --onefile --name '${{ matrix.build_name }}' \
              --collect-all mornye \
              --add-data 'mornye/frontend:mornye/frontend' \
              --add-data 'mornye/extensions:mornye/extensions' \
              --add-data 'mornye/tui:mornye/tui' \
              --hidden-import mornye.core.signed_session_desktop \
              --hidden-import mornye.core.signed_session_mobile \
              --hidden-import mornye.core.signed_session_mono \
              --hidden-import mpv \
              --console launcher.py
          "

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: bin-${{ matrix.build_name }}
        path: dist/${{ matrix.artifact_name }}
        retention-days: 7

  # The GUI packaged as an application, next to the command-line binaries
  # above: a .dmg with Mornye.app, a Windows installer and an AppImage. They
  # open the GUI on a double-click (desktop_launcher.py) where the CLI
  # binaries print their help. See packaging/mornye-desktop.spec.
  build-desktop:
    needs: lint-and-bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Mornye-macOS.dmg
          - os: windows-latest
            artifact_name: Mornye-Windows-Setup.exe
          # The oldest supported Ubuntu runner: an AppImage runs on systems
          # with this glibc or a newer one.
          - os: ubuntu-22.04
            artifact_name: Mornye-Linux-x86_64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: refs/tags/${{ needs.lint-and-bump.outputs.release_tag }}

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Qt build libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        # Present at build time so PyInstaller copies them into the
        # AppImage: Qt's xcb platform plugin needs them and not every
        # desktop has them installed.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libxcomposite1 \
          libxdamage1 libxrandr2 libxtst6 libasound2

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller certifi requests mutagen
        pip install .
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install "pywebview[qt]"
        fi

    - name: Fetch libmpv (Windows)
      if: runner.os == 'Windows'
      uses: ./.github/actions/fetch-libmpv

    - name: Build the app
      shell: bash
      run: |
        python packaging/make_icons.py
        pyinstaller --noconfirm packaging/mornye-desktop.spec

    # Arguments go to the normal command line, so --help exercises the
    # bundled imports without opening a window.
    - name: Smoke test the bundle
      shell: bash
      run: |
        case "$RUNNER_OS" in
          macOS)   BIN="dist/Mornye.app/Contents/MacOS/Mornye" ;;
          Windows) BIN="dist/Mornye/Mornye.exe" ;;
          *)       BIN="dist/Mornye/Mornye" ;;
        esac
        "$BIN" --help > /dev/null
        echo "$BIN starts."

    - name: Check the native engine is bundled (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        test -f dist/Mornye/_internal/libmpv-2.dll
        echo "libmpv-2.dll is in the bundle."

    # Unsigned and not notarized: macOS asks to confirm the first launch
    # (System Settings > Privacy & Security > Open Anyway).
    - name: Package .dmg (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p build/dmg
        cp -R dist/Mornye.app build/dmg/
        ln -s /Applications build/dmg/Applications
        hdiutil create -volname Mornye -srcfolder build/dmg -ov -format UDZO \
          "dist/${{ matrix.artifact_name }}"

    - name: Package installer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
        }
        $version = "${{ needs.lint-and-bump.outputs.release_tag }}".TrimStart('v')
        & $iscc "/DAppVersion=$version" packaging\windows\mornye.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

    - name: Package AppImage (Linux)
      if: runner.os == 'Linux'
      env:
        APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      run: |
        mkdir -p build/AppDir/usr/lib
        cp -a dist/Mornye build/AppDir/usr/lib/mornye
        cp packaging/linux/AppRun packaging/linux/mornye.desktop build/AppDir/
        cp build/icons/mornye.png build/AppDir/mornye.png
        cp build/icons/mornye.png build/AppDir/.DirIcon
        chmod +x build/AppDir/AppRun

        curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
        echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/appimagetool"
        # No FUSE on the runner: let the tool unpack itself instead.
        APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
          "$RUNNER_TEMP/appimagetool" build/AppDir "dist/${{ matrix.artifact_name }}"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: bin-desktop-${{ runner.os }}
        path: dist/${{ matrix.artifact_name }}
        retention-days: 7

  release:
      needs: [lint-and-bump, build, build-desktop]
      runs-on: ubuntu-latest
      if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
      
      steps:
        - name: Checkout code (For Changelog Generation)
          uses: actions/checkout@v5
          with:
            fetch-depth: 0
            ref: refs/tags/${{ needs.lint-and-bump.outputs.release_tag }}

        - name: Setup Python for changelog script
          uses: actions/setup-python@v6
          with:
            python-version: '3.12'

        - name: Download all build artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: bin-*
            path: release-files
            merge-multiple: true

        - name: Generate Changelog from CodeRabbit PR summaries
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITHUB_REPOSITORY: ${{ github.repository }}
          run: |
            pip install requests
            python -c "
            import os, re, subprocess, requests

            repo = os.environ['GITHUB_REPOSITORY']
            token = os.environ['GITHUB_TOKEN']
            headers = {
                'Authorization': f'Bearer {token}',
                'Accept': 'application/vnd.github+json',
            }

            # Trova la data del tag precedente per delimitare l'intervallo
            since = None
            try:
                prev_tag = subprocess.check_output(
                    'git describe --tags --abbrev=0 HEAD^', shell=True, stderr=subprocess.DEVNULL
                ).decode().strip()
                since = subprocess.check_output(
                    f'git log -1 --format=%aI {prev_tag}', shell=True
                ).decode().strip()
            except Exception:
                pass  # primo tag: prendi tutte le PR mergiate su main

            query = f'repo:{repo} is:pr is:merged base:main'
            if since:
                query += f' merged:>={since}'

            resp = requests.get(
                'https://api.github.com/search/issues',
                headers=headers,
                params={'q': query, 'per_page': 100, 'sort': 'created', 'order': 'asc'},
            )
            resp.raise_for_status()
            prs = resp.json().get('items', [])

            # Cattura tutto ciò che sta sotto '## Summary by CodeRabbit' fino
            # alla prossima intestazione di pari livello (o fine testo)
            pattern = re.compile(
                r'#{1,3}\s*Summary by CodeRabbit\s*\n(.*?)(?=\n#{1,3}\s|\Z)',
                re.DOTALL | re.IGNORECASE,
            )

            sections = []
            for pr in prs:
                number = pr['number']
                title = pr['title']
                body = pr.get('body') or ''
                match = pattern.search(body)
                summary = match.group(1).strip() if match else '_Nessun riepilogo CodeRabbit disponibile per questa PR._'
                sections.append(f'### #{number} — {title}\n\n{summary}')

            changelog = '\n\n'.join(sections) if sections else 'Manutenzione e aggiornamenti minori.'

            with open('ai_changelog.md', 'w', encoding='utf-8') as f:
                f.write(changelog)
            "

        - name: Prepare Final Release Body
          run: |
            cat << 'EOF' > release_body.md
            ## Changelog
            
            EOF
            
            cat ai_changelog.md >> release_body.md
            
            cat << 'EOF' >> release_body.md

            ## Downloads
            
            [![Windows](https://img.shields.io/badge/Windows-Mornye-0078D6?style=for-the-badge&logo=data:image/svg+xml;base64,)](https://github.com/${{ github.repository }}/releases/download/${{ needs.lint-and-bump.outputs.release_tag }}/Mornye-Windows-Setup.exe) [![macOS](https://img.shields.io/badge/macOS-Mornye-000000?style=for-the-badge&logo=apple&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ needs.lint-and-bump.outputs.release_tag }}/Mornye-macOS.dmg) [![Linux](https://img.shields.io/badge/Linux-Mornye-FFB300?style=for-the-badge&logo=linux&logoColor=black)](https://github.com/${{ github.repository }}/releases/download/${{ needs.lint-and-bump.outputs.release_tag }}/Mornye-Linux-x86_64.AppImage)

            <details>
            <summary><b>📦 Installing the app</b></summary>
            
            ### Windows
            Run `Mornye-Windows-Setup.exe`. It installs for your user only (no administrator prompt) and adds Mornye to the Start menu. The installer is not code-signed, so SmartScreen may show *Windows protected your PC*: choose **More info → Run anyway**.
            
            ### 🍏 macOS (Apple Silicon)
            Open `Mornye-macOS.dmg` and drag **Mornye** to **Applications**. The app is not notarized, so the first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway** (or run `xattr -dr com.apple.quarantine /Applications/Mornye.app`).
            
            ### 🐧 Linux (x86_64)
            ```bash
            chmod +x Mornye-Linux-x86_64.AppImage
            ./Mornye-Linux-x86_64.AppImage
            ```
            *(AppImages need FUSE 2: `sudo apt install libfuse2` on Ubuntu/Debian if it does not start.)*
            </details>

            <details>
            <summary><b>💻 Command-line binaries</b></summary>
            
            For scripts, servers and the terminal UI: `Mornye-Windows.exe`, `Mornye-macOS`, `Mornye-Linux-x86_64` and `Mornye-Linux-arm64`.
            
            ### Windows (PowerShell or CMD)
            ```cmd
            Mornye-Windows.exe [https://open.spotify.com/track/](https://open.spotify.com/track/)... ./out --service tidal
            ```

            ### 🍏 macOS
            ```bash
            chmod +x Mornye-macOS
            ./Mornye-macOS [https://open.spotify.com/track/](https://open.spotify.com/track/)... ./out --service tidal
            ```

            ### 🐧 Linux
            ```bash
            chmod +x Mornye-Linux-x86_64
            ./Mornye-Linux-x86_64 [https://open.spotify.com/track/](https://open.spotify.com/track/)... ./out --service tidal
            ```
            *(For ARM devices like Raspberry Pi, replace `x86_64` with `arm64`)*
            </details>
            EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.lint-and-bump.outputs.release_tag }}
            files: release-files/*
            draft: false
            prerelease: false
            body_path: release_body.md
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
